name: Frankenstein Chapter 1 eval
on:
  push:
    branches: [codex/constitutive-adversarial-reading]
  pull_request:
  workflow_dispatch:
concurrency:
  group: frankenstein-chapter1-${{ github.ref }}
  cancel-in-progress: true
jobs:
  chapter1:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Fetch Project Gutenberg Frankenstein
        run: |
          mkdir -p tmp artifacts
          curl -L --fail --retry 3 https://www.gutenberg.org/cache/epub/84/pg84.txt -o tmp/frankenstein.txt
      - name: Read Chapter 1 recursively
        run: node scripts/eval/frankenstein-book.mjs tmp/frankenstein.txt artifacts/frankenstein-chapter1-report.json "Chapter 1"
      - name: Summarize report
        run: |
          node -e "const r=require('./artifacts/frankenstein-chapter1-report.json'); console.log(JSON.stringify({scope:r.source.scope,propositions:r.source.propositions,cast:r.cast.count,relations:r.relations.count,graphNodes:r.graph.nodeCount,graphEdges:r.graph.edgeCount,taskCounts:r.tasks.byKindAndStatus,parameters:r.parameters?.parameters?.length,unresolved:r.finalFold?.unresolved?.length,runtime:r.runtime},null,2))"
      - uses: actions/upload-artifact@v4
        with:
          name: frankenstein-chapter1-report
          path: artifacts/frankenstein-chapter1-report.json
