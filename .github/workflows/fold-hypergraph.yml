name: Fold hypergraph benchmark

on:
  push:
    branches: [codex/fold-conditioned-recursive-reading]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  fold-hypergraph:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Fold, task, and hypergraph conformance
        run: node --test conformance/fold-conditioned-reading.test.js conformance/reading-tasks.test.js conformance/fold-native-hypergraph.test.js conformance/recursive-text-hypergraph.test.js
      - name: Frankenstein full-book hypergraph benchmark
        run: node scripts/frankenstein-hypergraph-benchmark.mjs
      - name: Upload Frankenstein benchmark report
        uses: actions/upload-artifact@v4
        with:
          name: frankenstein-hypergraph-benchmark
          path: |
            frankenstein-hypergraph-summary.json
            frankenstein-hypergraph-report.json
