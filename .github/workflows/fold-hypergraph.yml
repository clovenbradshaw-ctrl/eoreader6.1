name: Fold hypergraph benchmark

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  fold-hypergraph:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Fold and hypergraph conformance
        run: node --test conformance/fold-conditioned-reading.test.js conformance/fold-native-hypergraph.test.js conformance/recursive-text-hypergraph.test.js
      - name: Frankenstein full-book hypergraph benchmark
        run: node scripts/frankenstein-hypergraph-benchmark.mjs
