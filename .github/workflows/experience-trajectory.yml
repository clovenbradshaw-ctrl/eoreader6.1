name: Experience trajectory conformance
on:
  pull_request:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test conformance/experience-trajectory.test.js conformance/reading-semantic-golden.test.js conformance/net-new-blind-reading.test.js conformance/recursive-reading-golden.test.js
